version: "2"

run:
  timeout: 5m
  # The live driver and the evals are behind build tags. Without these
  # the linter never sees them. No file uses a negated constraint, so
  # both can be on at once.
  build-tags: [live, evals]

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - forbidigo
    - gocritic
    - gocyclo
    - gosec
    - govet
    - makezero
    - misspell
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        # D-08, D-09. Check the MESSAGE TEXT: a block that fails to load leaves depguard on its default rule.
        own-wire-types:
          deny:
            - pkg: "gitlab.com/gitlab-org/api/client-go"
              desc: "GitLab's client library; hand-write the fields used in internal/gitlab and send REST through internal/gapi (D-08)"
            - pkg: "github.com/xanzy/go-gitlab"
              desc: "the GitLab client library's old path; hand-write the fields used in internal/gitlab and send REST through internal/gapi (D-08)"
            - pkg: "github.com/shurcooL/graphql"
              desc: &graphql-client "a GraphQL client; write each operation as a literal in internal/gapi, sent through mutate by a function whose doc comment says why REST cannot do it (D-09)"
            - pkg: "github.com/hasura/go-graphql-client"
              desc: *graphql-client
            - pkg: "github.com/Khan/genqlient"
              desc: *graphql-client
            - pkg: "github.com/machinebox/graphql"
              desc: *graphql-client
    forbidigo:
      # Stdout carries only MCP JSON-RPC frames: the stdio transport says
      # the server MUST NOT write anything else there.
      #
      # Check the MESSAGE TEXT when verifying this works: a settings block
      # that fails to load leaves forbidigo on its defaults, firing,
      # looking like it works.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: "stdout carries only MCP JSON-RPC frames; write to an io.Writer the caller passed in, or slog to stderr"
        - pattern: ^os\.Stdout$
          msg: "only main names the process's streams; take an io.Writer instead"
    gocyclo:
      min-complexity: 25
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: unused-parameter
        - name: empty-block
        - name: unreachable-code
  exclusions:
    rules:
      # main names the process's streams once and passes them down, and
      # scripts/ is maintainer tooling rather than the server.
      - path: ^cmd/
        linters: [forbidigo]
      - path: ^scripts/
        linters: [forbidigo, gosec]
      - path: _test\.go$
        linters: [gocyclo, unparam, errcheck, bodyclose, revive, prealloc, gosec]
      # The in-memory instance is test scaffolding.
      - path: ^internal/gapi/gitlabtest/
        linters: [revive, gosec, errcheck]

formatters:
  enable:
    - gofmt
