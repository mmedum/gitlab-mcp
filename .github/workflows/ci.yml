name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every `run` step, on every platform. Without it the Windows runner uses
# PowerShell, which reads -coverprofile=cov.out as a file called `cov`.
# Explicit bash also turns on pipefail.
defaults:
  run:
    shell: bash

# A push supersedes the run before it on the same ref, except on main:
# a canceled run there leaves a merged commit with no verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every step that checks something is a `make` target, so `make parity`
# can hold this file against `make check` by reading recipes.
jobs:
  # The keyring, the config directory, file permissions and the .exe
  # path differ per OS, so every gate and the coverage floors run on all
  # three rather than on one while the matrix advertises three.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # schema-diff builds the newest tag and staleness asks what
          # changed since it; a shallow clone has no tags.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt
      - name: vet
        run: make vet
      - name: tidy
        run: make tidy
      - name: test and coverage floors
        run: make cover
      - name: leak scan
        run: make leaks
      - name: workflow and tool pins
        run: make pins
      - name: error classes
        run: make classes
      - name: API operation coverage
        run: make api-coverage
      - name: API field coverage
        run: make api-fields
      - name: schema diff
        run: make schema-diff
      - name: tool descriptions
        run: make descriptions
      - name: quick-action guard on every body
        run: make bodies
      - name: stdio smoke
        run: make smoke
      - name: docs match the code
        run: make staleness
      - name: definition of done
        run: make checklist
      - name: CHANGELOG links
        run: make changelog-links
      - name: transcript redaction
        run: make transcript
      - name: live driver coverage
        run: make live-cover
      - name: write outcomes
        run: make outcomes
      - name: eval scorers
        run: make evals-check
      - name: bundle manifest
        run: make mcpb
      - name: release wiring
        run: make release
      - name: registry entry
        run: make server-json
      - name: make and CI parity
        run: make parity
      # The whole surface with every flag on, for a reviewer to read.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: schemas
          path: schemas.json
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # golangci-lint through `go run`, the goinstall mode: a prebuilt
      # binary built with an older Go refuses this module.
      - name: golangci-lint
        run: make lint
      - name: vulnerabilities
        run: make vuln
      - name: licenses
        run: make licenses
      - name: actionlint
        run: make actionlint
      # The release config is otherwise exercised only by a tag, when a
      # mistake is already public.
      - name: goreleaser check
        run: make goreleaser-check

  # A credential committed and edited out later is invisible to a tree
  # scan, so this reads every commit, on every pull request.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gitleaks
        run: make secrets

  # What a pull request adds, measured from the merge-base of its head
  # and the base branch as the full-history checkout sees it now. Never
  # github.event.pull_request.base.sha: it is fixed when the event fires
  # and is stale in a stack of pull requests.
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_BASE_REF: origin/${{ github.base_ref }}
      # The head commit, not the merge commit the checkout sits on.
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: merge-base
        run: make merge-base
      - name: CHANGELOG entry
        run: make changelog
      - name: schema change acknowledged
        run: make schema-ack
